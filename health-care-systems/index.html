<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健康照護體系｜課堂活動列表</title>
<meta name="description" content="蔡懿玲　健康照護體系課程之課堂活動與互動網頁列表。">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --paper:#EBEEEC; --surface:#F6F8F6; --surface-2:#FFFFFF;
  --ink:#15211E; --ink-soft:#33433E; --muted:#5E6E69; --faint:#8A978F;
  --line:#D6DCD8; --line-soft:#E3E8E4;
  --brand:#0E4D45; --brand-2:#3C8C80;
  --gold:#9C6E1E;
  --shadow:0 1px 2px rgba(20,33,30,.05),0 10px 34px -14px rgba(20,33,30,.16);
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif TC","Songti TC",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1614; --surface:#151F1C; --surface-2:#1A2622;
    --ink:#E9EEEB; --ink-soft:#C4CFCA; --muted:#94A29C; --faint:#6E7C77;
    --line:#26332F; --line-soft:#202B28;
    --brand:#56B7A7; --brand-2:#6FC9BA;
    --gold:#D8AC57;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
    --paper:#0E1614; --surface:#151F1C; --surface-2:#1A2622;
    --ink:#E9EEEB; --ink-soft:#C4CFCA; --muted:#94A29C; --faint:#6E7C77;
    --line:#26332F; --line-soft:#202B28;
    --brand:#56B7A7; --brand-2:#6FC9BA;
    --gold:#D8AC57;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
nav{border-bottom:1px solid var(--line);background:var(--paper)}
.nav-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-weight:600;font-size:18px;text-decoration:none;color:var(--ink)}
.brand .mono{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px}
.kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-2);font-weight:600}
header.hd{padding:48px 0 22px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,6vw,40px);line-height:1.2;margin:8px 0 0}
.sub{color:var(--muted);margin-top:10px;font-size:15px}
ol.acts{list-style:none;margin:0 0 60px;padding:0;display:flex;flex-direction:column;gap:12px}
ol.acts a{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);transition:border-color .18s}
ol.acts a:hover{border-color:var(--brand-2)}
ol.acts a:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.t{font-weight:700;font-size:17px;line-height:1.45}
.m{font-size:13.5px;color:var(--muted);margin-top:2px}
.go{margin-left:auto;color:var(--brand-2);font-weight:700;flex:none}
</style>
</head>
<body>
<nav><div class="nav-in"><a class="brand" href="../"><span class="mono">蔡</span>蔡懿玲研究室</a></div></nav>
<div class="wrap">
  <header class="hd">
    <span class="kicker">健康照護體系　Health Care Systems</span>
    <h1>課堂活動列表</h1>
    <div class="sub">國立臺北護理健康大學　助理教授　蔡懿玲</div>
  </header>
  <ol class="acts">
    <li><a href="payment-game/">
      <div><div class="t">1. 支付制度_院長經營模擬遊戲</div><div class="m">第 7 章第二節　財源籌措｜2026 年 9 月</div></div>
      <span class="go">→</span></a></li>
  </ol>
</div>
</body>
</html>
