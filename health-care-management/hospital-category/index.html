<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>醫院法律分類配對遊戲</title>
<meta name="color-scheme" content="light">
<style>
:root{
  --paper:#F3F5F4; --card:#FFFFFF; --ink:#15211E; --soft:#3A4A45; --muted:#5E6E69;
  --line:#D3DAD6; --brand:#0E4D45; --brand-2:#2F7F73;
  --ok:#157A3E; --ok-bg:#E6F4EA; --bad:#B42318; --bad-bg:#FDECEA;
  --shadow:0 1px 2px rgba(20,33,30,.05),0 8px 24px -12px rgba(20,33,30,.18);
  /* 五類分類色：淺底＋深字，選取時填滿 */
  --c1:#3651B5; --c1-bg:#EAEEFB;   /* 公立 */
  --c2:#9A5B00; --c2-bg:#FFF3DC;   /* 財團法人 */
  --c3:#11734F; --c3-bg:#E3F5EC;   /* 社團法人 */
  --c4:#B0304A; --c4-bg:#FCE9ED;   /* 法人附設 */
  --c5:#6B3FB0; --c5-bg:#F1EAFB;   /* 私立 */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:110px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.hd{background:var(--brand);color:#fff;padding:22px 0 20px}
header.hd h1{margin:0;font-size:clamp(24px,5.5vw,32px);line-height:1.3;font-weight:800;letter-spacing:.02em}
header.hd p{margin:6px 0 0;font-size:16px;opacity:.9}
.howto{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0;box-shadow:var(--shadow);font-size:17px}
.howto b{color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend span{font-size:15px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor}
.list{display:flex;flex-direction:column;gap:14px}
.h{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:border-color .15s}
.h.done{border-color:var(--brand-2)}
.h.right{border-color:var(--ok);background:var(--ok-bg)}
.h.wrong{border-color:var(--bad);background:var(--bad-bg)}
.loc{font-size:15px;color:var(--muted);font-weight:600}
.name{font-size:21px;font-weight:800;line-height:1.4;margin:2px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt{appearance:none;font:inherit;font-size:16px;font-weight:700;min-height:46px;padding:8px 14px;border-radius:12px;
  border:2px solid var(--c);background:var(--cbg);color:var(--c);cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,background .15s,color .15s}
.opt:active{transform:scale(.97)}
.opt .n{font-size:13px;font-weight:700;opacity:.8}
.opt.sel{background:var(--c);color:#fff}
.opt:disabled{opacity:.3;cursor:not-allowed}
.opt.sel:disabled{opacity:1}
.locked .opt:not(.sel){opacity:.22}
.locked .opt .n{display:none}
.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.k1{--c:var(--c1);--cbg:var(--c1-bg)} .k2{--c:var(--c2);--cbg:var(--c2-bg)} .k3{--c:var(--c3);--cbg:var(--c3-bg)}
.k4{--c:var(--c4);--cbg:var(--c4-bg)} .k5{--c:var(--c5);--cbg:var(--c5-bg)}
.fb{margin-top:10px;font-size:17px;font-weight:800}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  box-shadow:0 -6px 20px -10px rgba(20,33,30,.25);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;gap:14px}
.prog{font-size:18px;font-weight:800;white-space:nowrap}
.prog small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.btn{appearance:none;font:inherit;font-size:18px;font-weight:800;border:0;border-radius:14px;min-height:52px;padding:10px 20px;cursor:pointer;touch-action:manipulation}
.btn.main{background:var(--brand);color:#fff;flex:1}
.btn.main:disabled{background:#AEB9B5;cursor:not-allowed}
.btn.sub{background:#E4E9E7;color:var(--ink)}
#again{flex:1}
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:20px;padding:28px 22px;max-width:420px;width:100%;text-align:center}
.score{font-size:64px;font-weight:900;color:var(--brand);line-height:1.1}
.detail{font-size:17px;color:var(--soft);margin:4px 0 10px}
.msg{font-size:21px;font-weight:800;margin:0 0 20px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<header class="hd"><div class="wrap">
  <h1>🏥 醫院法律分類配對</h1>
  <p>依《醫療法》判斷每家醫院屬於哪一種法律分類</p>
</div></header>

<main class="wrap">
  <div class="howto">
    <b>玩法：</b>每家醫院<b>點一下</b>你認為的分類即可；再點一次可取消。按鈕上的數字是該分類<b>還剩幾個名額</b>（下方為各簡稱對應的法律分類與家數），用完就不能再選。全部選完後按下方「送出驗證」。
    <div class="legend" id="legend"></div>
  </div>
  <div class="list" id="list"></div>
</main>

<div class="bar"><div class="wrap">
  <div class="prog"><span id="prog">0 / 16</span><small>已作答</small></div>
  <button class="btn main" id="submit" disabled>送出驗證</button>
  <button class="btn sub" id="again" hidden>再玩一次</button>
</div></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="msg">
  <div class="modal">
    <div class="score" id="pct">0%</div>
    <div class="detail" id="detail"></div>
    <p class="msg" id="msg"></p>
    <div class="row">
      <button class="btn sub" id="review">檢視對錯</button>
      <button class="btn main" id="reset">再玩一次</button>
    </div>
  </div>
</div>

<script>
const hospitals = [
  { id: 1, location: "新北投", name: "三軍總醫院北投分院", answer: "公立醫療機構" },
  { id: 2, location: "石牌", name: "臺北榮民總醫院", answer: "公立醫療機構" },
  { id: 3, location: "石牌", name: "振興醫院", answer: "醫療法人 (財團法人)" },
  { id: 4, location: "芝山", name: "北市聯醫（陽明院區）", answer: "公立醫療機構" },
  { id: 5, location: "士林", name: "新光吳火獅紀念醫院", answer: "醫療法人 (財團法人)" },
  { id: 6, location: "雙連", name: "馬偕紀念醫院（總院）", answer: "醫療法人 (財團法人)" },
  { id: 7, location: "台北車站", name: "北市聯醫（中興院區）", answer: "公立醫療機構" },
  { id: 8, location: "台大醫院", name: "台大醫院（總院）", answer: "公立醫療機構" },
  { id: 9, location: "中正紀念堂", name: "北市聯醫（婦幼院區）", answer: "公立醫療機構" },
  { id: 10, location: "信義安和", name: "國泰綜合醫院", answer: "醫療法人 (財團法人)" },
  { id: 11, location: "象山", name: "臺北醫學大學附設醫院", answer: "法人附設醫療機構" },
  { id: 12, location: "高雄市", name: "阮綜合醫院", answer: "醫療法人 (社團法人)" },
  { id: 13, location: "台中市", name: "澄清醫院", answer: "醫療法人 (社團法人)" },
  { id: 14, location: "桃園市", name: "天成醫院", answer: "醫療法人 (社團法人)" },
  { id: 15, location: "松山區", name: "博仁綜合醫院", answer: "私立醫療機構" },
  { id: 16, location: "平鎮區", name: "秉坤婦幼醫院", answer: "私立醫療機構" }
];
const cats = ["公立醫療機構","醫療法人 (財團法人)","醫療法人 (社團法人)","法人附設醫療機構","私立醫療機構"];
const cls = c => "k" + (cats.indexOf(c) + 1);
const short = {"公立醫療機構":"公立","醫療法人 (財團法人)":"財團法人","醫療法人 (社團法人)":"社團法人","法人附設醫療機構":"法人附設","私立醫療機構":"私立"};
const quota = Object.fromEntries(cats.map(c => [c, hospitals.filter(h => h.answer === c).length]));

let answers = {}, submitted = false, order = [];
const $ = id => document.getElementById(id);

function left(c){ return quota[c] - Object.values(answers).filter(a => a === c).length; }

function render(){
  $("legend").innerHTML = cats.map(c => `<span class="${cls(c)}" style="color:var(--c)">${short[c]}＝${c}（${quota[c]} 家）</span>`).join("");
  $("list").innerHTML = order.map(h => {
    const mine = answers[h.id];
    let state = mine ? "done" : "", fb = "";
    if (submitted && reviewing){
      const ok = mine === h.answer;
      state = ok ? "right" : "wrong";
      fb = ok ? `<div class="fb ok">✓ 正確</div>` : `<div class="fb no">✗ 正確答案：${h.answer}</div>`;
    }
    const opts = cats.map(c => {
      const sel = mine === c, n = left(c);
      const dis = submitted || (!sel && n <= 0);
      return `<button class="opt ${cls(c)}${sel ? " sel" : ""}" data-h="${h.id}" data-c="${c}" aria-pressed="${sel}" aria-label="${c}"${dis ? " disabled" : ""}>${short[c]}<span class="n">剩 ${n}</span></button>`;
    }).join("");
    return `<section class="h ${state}${submitted ? " locked" : ""}"><div class="loc">📍 ${h.location}</div><div class="name">${h.name}</div><div class="opts">${opts}</div>${fb}</section>`;
  }).join("");
  const done = Object.keys(answers).length;
  $("prog").textContent = `${done} / ${hospitals.length}`;
  $("submit").disabled = submitted || done < hospitals.length;
  $("submit").hidden = submitted;
  $("again").hidden = !submitted;
}

let reviewing = false;
$("list").addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (!b || submitted) return;
  const id = b.dataset.h, c = b.dataset.c;
  if (answers[id] === c) delete answers[id]; else answers[id] = c;
  render();
});

$("submit").onclick = () => {
  submitted = true;
  const score = hospitals.filter(h => answers[h.id] === h.answer).length;
  const pct = Math.round(score / hospitals.length * 100);
  $("pct").textContent = pct + "%";
  $("detail").textContent = `答對 ${score} / ${hospitals.length} 家`;
  $("msg").textContent = pct === 100 ? "完璧！您是醫療法規專家！" : pct >= 70 ? "表現優秀！僅有少數錯誤。" : "建議重新複習醫療法相關條文。";
  $("overlay").classList.add("show");
  render();
};
$("review").onclick = () => { reviewing = true; $("overlay").classList.remove("show"); render(); window.scrollTo({top:0,behavior:"smooth"}); };
function reset(){
  answers = {}; submitted = false; reviewing = false;
  order = [...hospitals].sort(() => Math.random() - 0.5);
  $("overlay").classList.remove("show"); render(); window.scrollTo({top:0});
}
$("reset").onclick = reset; $("again").onclick = reset;
reset();
</script>
</body>
</html>
