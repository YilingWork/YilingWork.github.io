<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的電台課程</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="電台課程">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --muted:#6b6f78; --line:#e4e1d9;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e3f0ec; --warn:#b4541a;
  --half:#c98a12; --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d; --card:#20232a; --ink:#ecedef; --muted:#9aa0aa; --line:#2f333c;
    --accent:#4fb39a; --accent-ink:#0d1512; --accent-soft:#1d3530; --warn:#e38a52;
    --half:#e2b24a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d; --card:#20232a; --ink:#ecedef; --muted:#9aa0aa; --line:#2f333c;
  --accent:#4fb39a; --accent-ink:#0d1512; --accent-soft:#1d3530; --warn:#e38a52;
  --half:#e2b24a; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header.top .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;font-size:22px;padding:4px 8px;border-radius:10px;line-height:1}
.iconbtn:active{background:var(--line)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:7px 12px;font-size:15px;border-radius:10px}
.btn.danger{background:var(--card);color:var(--warn);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.hero{display:block;width:100%;text-align:left;margin:6px 0 16px;padding:16px;border-radius:16px}
.hero .k{font-size:14px;opacity:.85;font-weight:500}
.hero .t{font-size:19px}
.section-h{font-size:14px;color:var(--muted);margin:22px 0 8px;font-weight:600;letter-spacing:.02em}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.course{display:flex;gap:12px;padding:12px;margin-bottom:10px;align-items:center;width:100%;text-align:left}
.course img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--line);flex:none}
.course .info{flex:1;min-width:0}
.course .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course .meta{font-size:14px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.toolbar{display:flex;gap:8px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:15px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.ep{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;
  background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.ep:last-child{border-bottom:0}
.ep .no{width:44px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.ep .tt{flex:1;min-width:0}
.ep .tt .s{font-size:13px;color:var(--muted)}
.ep .st{flex:none;width:28px;text-align:center;font-size:18px}
.ep.done .tt{color:var(--muted)}
.st .ok{color:var(--accent)}
.st .half{color:var(--half)}
.ep.current{background:var(--accent-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.err{color:var(--warn)}
/* player */
.player{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:15;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.ptitle{font-weight:600;margin:0 0 6px;font-size:17px}
.prow{display:flex;align-items:center;justify-content:center;gap:14px}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600}
.round.big{width:64px;height:64px;background:var(--accent);color:var(--accent-ink);border:0;font-size:26px}
.seekrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.seekrow input{flex:1;accent-color:var(--accent)}
.prow2{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap}
.speed{min-width:62px}
.pdfbox{margin-top:12px}
.pdfbox canvas{display:block;width:100%;height:auto;margin:0 0 10px;border-radius:8px;background:#fff;box-shadow:var(--shadow)}
.pdfbox.zoom{overflow-x:auto}
.pdfbox.zoom canvas{width:170%;max-width:none}
.banner[hidden]{display:none}
.banner{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);display:flex;gap:10px;align-items:center;justify-content:space-between}
/* mini player */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none}
.mini .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mini .mt{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0}
.mini .mt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.mini .mt span{font-size:13px;color:var(--muted)}
.mini .round{width:44px;height:44px}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.panel{padding:16px;margin-bottom:12px}
.panel p{margin:0 0 10px}
.flexgap{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:15px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="row">
  <button class="iconbtn" id="backBtn" aria-label="返回" hidden>‹</button>
  <h1 id="title">我的電台課程</h1>
  <button class="iconbtn" id="settingsBtn" aria-label="設定">⚙︎</button>
</div></header>
<main class="wrap" id="view"></main>

<div class="mini" id="mini"><div class="in">
  <button class="mt" id="miniOpen"><b id="miniTitle"></b><span id="miniSub"></span></button>
  <button class="round" id="miniPlay" aria-label="播放／暫停">▶</button>
</div></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
'use strict';
const API = 'https://channelplus.ner.gov.tw/api/v1';
const SITE = 'https://channelplus.ner.gov.tw';
const DEFAULT_COURSE = {id:'9a5ad71c-65fa-4bc3-87ed-d1e49d71d5eb', name:'辦公英語通', image:'5aa778f61263ec00059f9a8d'};
const STORE_KEY = 'rc_v1';
const SPEEDS = [0.75, 1, 1.25, 1.5];
const DONE_RATIO = 0.9;

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- storage ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

function loadState(){
  let s = null;
  try { s = JSON.parse(lsGet(STORE_KEY) || 'null'); } catch(e){}
  if (!s || typeof s !== 'object') s = {};
  s.courses = Array.isArray(s.courses) ? s.courses : [];
  s.progress = s.progress && typeof s.progress === 'object' ? s.progress : {};
  s.speed = SPEEDS.includes(s.speed) ? s.speed : 1;
  s.filter = s.filter || {};
  s.order = s.order || {};
  if (!s.initialized){
    s.courses.push({id:DEFAULT_COURSE.id, name:DEFAULT_COURSE.name, image:DEFAULT_COURSE.image, addedAt:Date.now(), archived:false});
    s.initialized = true;
  }
  return s;
}
let state = loadState();
function save(){ lsSet(STORE_KEY, JSON.stringify(state)); }
save();

const pkey = (pid,eid) => pid + '|' + eid;
function prog(pid,eid){ return state.progress[pkey(pid,eid)] || null; }
function setProg(pid,eid,patch){
  const k = pkey(pid,eid);
  state.progress[k] = Object.assign({}, state.progress[k] || {}, patch, {t:Date.now()});
  save();
}
function course(pid){ return state.courses.find(c => c.id === pid); }

/* ---------- episodes ---------- */
const epsMem = {};
function cachedEps(pid){
  if (epsMem[pid]) return epsMem[pid];
  try { const v = JSON.parse(lsGet('rc_eps_' + pid) || 'null'); if (v && Array.isArray(v.eps)) { epsMem[pid] = v.eps; return v.eps; } } catch(e){}
  return null;
}
function compactEp(e){
  return {
    id: e.episodeId,
    n: (typeof e.episodeNumber === 'number') ? e.episodeNumber : null,
    title: e.title || '',
    dur: e.duration || 0,
    voice: e.voice && e.voice.voiceRef ? e.voice.voiceRef : null,
    pdf: (e.attachments || []).filter(a => (a.fileType || '').toLowerCase() === 'pdf').map(a => ({key:a.attachmentKey, name:a.originalName})),
    date: e.releaseDate || e.publishDate || ''
  };
}
function sortEps(list){
  return list.slice().sort((a,b) => {
    if (a.n != null && b.n != null && a.n !== b.n) return a.n - b.n;
    return (a.date || '').localeCompare(b.date || '');
  });
}
async function fetchJSON(url){
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if (d.rtnCode && d.rtnCode !== '0000') throw new Error(d.rtnMsg || '電台回傳錯誤');
  return d;
}
async function fetchEps(pid){
  let page = 1, total = 1, all = [];
  do {
    const d = await fetchJSON(`${API}/programs/episodes/${pid}?page=${page}`);
    all = all.concat(d.data || []);
    total = (d.pagination && d.pagination.totalPages) || 1;
    page++;
  } while (page <= total && page < 100);
  const eps = sortEps(all.map(compactEp));
  epsMem[pid] = eps;
  lsSet('rc_eps_' + pid, JSON.stringify({at:Date.now(), eps}));
  return eps;
}
const inflight = {};
function refreshEps(pid){
  if (!inflight[pid]) inflight[pid] = fetchEps(pid).finally(() => { delete inflight[pid]; });
  return inflight[pid];
}
async function getEps(pid){
  return cachedEps(pid) || await refreshEps(pid);
}
function epLabel(ep){ return ep.n != null ? '第 ' + ep.n + ' 集' : ''; }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t){ t = Math.max(0, Math.floor(t || 0)); const m = Math.floor(t/60), s = t % 60; return m + ':' + String(s).padStart(2,'0'); }
function imgUrl(ref){ return ref ? `${API}/image?key=${encodeURIComponent(ref)}` : 'icon-192.png'; }
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); }
function stats(pid){
  const eps = cachedEps(pid) || [];
  let done = 0;
  for (const e of eps) { const p = prog(pid, e.id); if (p && p.done) done++; }
  return {done, total: eps.length};
}
function statusOf(pid, ep){
  const p = prog(pid, ep.id);
  if (p && p.done) return 'done';
  if (p && p.pos > 5) return 'half';
  return 'new';
}
// 繼續：課程內最近一次聽的那集若未聽完就續播，否則從頭找第一個未聽集
function nextUp(pid){
  const eps = cachedEps(pid);
  if (!eps || !eps.length) return null;
  const c = course(pid);
  if (c && c.lastEid){
    const last = eps.find(e => e.id === c.lastEid);
    if (last && statusOf(pid, last) !== 'done') return last;
    if (last){
      const i = eps.indexOf(last);
      for (let j = i + 1; j < eps.length; j++) if (statusOf(pid, eps[j]) !== 'done') return eps[j];
    }
  }
  return eps.find(e => statusOf(pid, e) !== 'done') || null;
}

/* ---------- audio engine ---------- */
const audio = $('#audio');
let cur = null; // {pid, eid, ep, courseName}
let lastSaved = 0;
let pendingSeek = null;

function startEpisode(pid, ep, autoplay){
  const c = course(pid);
  if (cur && cur.pid === pid && cur.eid === ep.id){
    if (autoplay && audio.paused) audio.play().catch(()=>{});
    return;
  }
  saveNow();
  cur = {pid, eid: ep.id, ep, courseName: c ? c.name : ''};
  if (c){ c.lastEid = ep.id; c.lastAt = Date.now(); }
  state.last = {pid, eid: ep.id};
  save();
  const p = prog(pid, ep.id);
  pendingSeek = (p && p.pos && !(p.done && p.pos > (ep.dur || 600) * DONE_RATIO)) ? p.pos : null;
  if (!ep.voice){ audio.removeAttribute('src'); audio.load(); updateUI(); return; }
  audio.src = `${API}/audio?key=${encodeURIComponent(ep.voice)}`;
  audio.playbackRate = state.speed;
  audio.load();
  if (autoplay) audio.play().catch(() => {});
  setMediaSession();
  updateUI();
}
audio.addEventListener('loadedmetadata', () => {
  if (pendingSeek != null && pendingSeek < audio.duration - 3){ try { audio.currentTime = pendingSeek; } catch(e){} }
  pendingSeek = null;
  audio.playbackRate = state.speed;
  updateUI();
});
function saveNow(){
  if (!cur || !audio.src || isNaN(audio.currentTime) || audio.currentTime < 1) return;
  setProg(cur.pid, cur.eid, {pos: Math.floor(audio.currentTime)});
}
audio.addEventListener('timeupdate', () => {
  if (!cur) return;
  const now = Date.now();
  if (now - lastSaved > 5000){ lastSaved = now; saveNow(); }
  const d = audio.duration;
  if (d && audio.currentTime / d >= DONE_RATIO){
    const p = prog(cur.pid, cur.eid);
    if (!p || !p.done){ setProg(cur.pid, cur.eid, {done:true}); toast('已標記為聽過 ✓'); refreshListMarks(); }
  }
  updateTime();
});
audio.addEventListener('play', updateUI);
audio.addEventListener('pause', () => { saveNow(); updateUI(); });
audio.addEventListener('ratechange', updateUI);
audio.addEventListener('ended', () => {
  if (!cur) return;
  setProg(cur.pid, cur.eid, {done:true, pos:0});
  updateUI(); refreshListMarks();
  showNextBanner();
});
audio.addEventListener('error', () => {
  if (!audio.getAttribute('src')) return;
  const box = $('#audioErr');
  if (box){ box.hidden = false; }
  toast('音檔讀取失敗，可改到電台網站收聽');
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', saveNow);

function togglePlay(){
  if (!cur) return;
  if (audio.paused) audio.play().catch(() => toast('無法播放，請再按一次')); else audio.pause();
}
function skip(sec){
  if (!cur || isNaN(audio.duration)) return;
  audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), audio.duration - 0.5);
}
function neighbor(dir){
  if (!cur) return null;
  const eps = cachedEps(cur.pid) || [];
  const i = eps.findIndex(e => e.id === cur.eid);
  return i < 0 ? null : (eps[i + dir] || null);
}
function goEpisode(pid, ep, autoplay){
  startEpisode(pid, ep, autoplay);
  const h = `#/c/${pid}/e/${ep.id}`;
  if (location.hash === h) render(); else location.hash = h;
}
function setMediaSession(){
  if (!('mediaSession' in navigator) || !cur) return;
  const c = course(cur.pid);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: cur.ep.title || epLabel(cur.ep),
      artist: cur.courseName,
      album: '電台課程',
      artwork: [{src: c && c.image ? imgUrl(c.image) : new URL('icon-512.png', location.href).href, sizes:'512x512'}]
    });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('seekbackward', () => skip(-10));
    navigator.mediaSession.setActionHandler('seekforward', () => skip(10));
    navigator.mediaSession.setActionHandler('previoustrack', () => { const n = neighbor(-1); if (n) goEpisode(cur.pid, n, true); });
    navigator.mediaSession.setActionHandler('nexttrack', () => { const n = neighbor(1); if (n) goEpisode(cur.pid, n, true); });
  } catch(e){}
}

/* ---------- UI updates ---------- */
function updateTime(){
  const d = audio.duration || (cur && cur.ep.dur) || 0;
  const t = audio.currentTime || 0;
  const seek = $('#seek');
  if (seek && !seek.dataset.drag){ seek.max = Math.floor(d); seek.value = Math.floor(t); }
  const a = $('#tNow'), b = $('#tDur');
  if (a) a.textContent = fmt(t);
  if (b) b.textContent = fmt(d);
  const ms = $('#miniSub');
  if (ms && cur) ms.textContent = (cur.courseName ? cur.courseName + '・' : '') + fmt(t) + ' / ' + fmt(d);
}
function updateUI(){
  const playing = cur && !audio.paused;
  const pb = $('#playBtn'); if (pb) pb.textContent = playing ? '❚❚' : '▶';
  $('#miniPlay').textContent = playing ? '❚❚' : '▶';
  const sp = $('#speedBtn'); if (sp) sp.textContent = state.speed + '×';
  const inPlayer = route().ep;
  const showMini = cur && !(inPlayer && route().pid === cur.pid && route().ep === cur.eid);
  $('#mini').style.display = showMini ? 'block' : 'none';
  if (cur){ $('#miniTitle').textContent = cur.ep.title || epLabel(cur.ep); }
  const mk = $('#markBtn');
  if (mk && cur){ const p = prog(cur.pid, cur.eid); mk.textContent = p && p.done ? '✓ 已聽（按此改回未聽）' : '標記為已聽'; }
  updateTime();
}
function refreshListMarks(){
  const r = route();
  if (r.pid && !r.ep && !r.page) renderCourse(r.pid, true);
}
function showNextBanner(){
  const box = $('#nextBox');
  const n = neighbor(1);
  if (!box) { if (n) toast('本集聽完了，下一集：' + (n.title || epLabel(n))); return; }
  box.innerHTML = n
    ? `<span>本集聽完了 🎉</span><button class="btn small" id="nextGo">播下一集 ›</button>`
    : `<span>本集聽完了 🎉 這是最後一集</span>`;
  box.hidden = false;
  const g = $('#nextGo'); if (g) g.onclick = () => goEpisode(cur.pid, n, true);
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'add') return {page:'add'};
  if (parts[0] === 'settings') return {page:'settings'};
  if (parts[0] === 'c' && parts[1]) return {pid: parts[1], ep: parts[2] === 'e' ? parts[3] : null};
  return {page:'home'};
}
window.addEventListener('hashchange', render);
$('#backBtn').onclick = () => {
  const r = route();
  if (r.ep) location.hash = '#/c/' + r.pid;
  else location.hash = '#/';
};
$('#settingsBtn').onclick = () => { location.hash = '#/settings'; };
$('#miniPlay').onclick = togglePlay;
$('#miniOpen').onclick = () => { if (cur) location.hash = `#/c/${cur.pid}/e/${cur.eid}`; };

let renderToken = 0;
function render(){
  renderToken++;
  const r = route();
  $('#backBtn').hidden = !(r.pid || r.page === 'add' || r.page === 'settings');
  $('#settingsBtn').hidden = r.page !== 'home';
  window.scrollTo(0, 0);
  if (r.page === 'add') renderAdd();
  else if (r.page === 'settings') renderSettings();
  else if (r.pid && r.ep) renderPlayer(r.pid, r.ep);
  else if (r.pid) renderCourse(r.pid);
  else renderHome();
  updateUI();
}

/* ---------- home ---------- */
function renderHome(){
  $('#title').textContent = '我的電台課程';
  const active = state.courses.filter(c => !c.archived);
  const archived = state.courses.filter(c => c.archived);
  let html = '';
  const last = state.last && course(state.last.pid) && !course(state.last.pid).archived ? state.last : null;
  if (last){
    const c = course(last.pid);
    const ep = nextUp(last.pid);
    if (ep){
      const p = prog(last.pid, ep.id);
      html += `<button class="btn hero" id="heroGo"><div class="k">▶ 繼續上次・${esc(c.name)}</div>
        <div class="t">${esc(ep.title || epLabel(ep))}${p && p.pos && !p.done ? '（從 ' + fmt(p.pos) + ' 接著聽）' : ''}</div></button>`;
    }
  }
  html += `<div class="section-h">正在上的課</div>`;
  html += active.length ? active.map(courseCard).join('') : `<div class="card empty">還沒有課程，按下方「新增課程」加入</div>`;
  html += `<button class="btn ghost" style="width:100%;margin-top:4px" id="addBtn">＋ 新增課程</button>`;
  if (archived.length){
    html += `<div class="section-h">已完成／封存</div>` + archived.map(courseCard).join('');
  }
  $('#view').innerHTML = html;
  const hg = $('#heroGo');
  if (hg) hg.onclick = () => { const ep = nextUp(last.pid); if (ep) goEpisode(last.pid, ep, true); };
  $('#addBtn').onclick = () => { location.hash = '#/add'; };
  document.querySelectorAll('[data-course]').forEach(b => b.onclick = () => { location.hash = '#/c/' + b.dataset.course; });
  // 背景補抓尚未快取的課程清單，抓完更新進度數字
  const tok = renderToken;
  state.courses.forEach(c => { if (!cachedEps(c.id)) refreshEps(c.id).then(() => { if (tok === renderToken) renderHome(); }).catch(()=>{}); });
}
function courseCard(c){
  const s = stats(c.id);
  const pct = s.total ? Math.round(s.done / s.total * 100) : 0;
  const meta = s.total ? `已聽 ${s.done} / ${s.total} 集` : '載入中…';
  return `<button class="card course" data-course="${esc(c.id)}">
    <img src="${esc(imgUrl(c.image))}" alt="" loading="lazy">
    <div class="info"><div class="name">${esc(c.name)}</div><div class="meta">${meta}</div>
    <div class="bar"><i style="width:${pct}%"></i></div></div></button>`;
}

/* ---------- course ---------- */
async function renderCourse(pid, quiet){
  const c = course(pid);
  if (!c){ $('#view').innerHTML = `<div class="card empty">找不到這門課程。<br><a href="#/">回首頁</a></div>`; return; }
  $('#title').textContent = c.name;
  const tok = renderToken;
  let eps = cachedEps(pid);
  if (!eps){
    $('#view').innerHTML = `<div class="empty">載入集數中…</div>`;
    try { eps = await refreshEps(pid); }
    catch(e){
      if (tok !== renderToken) return;
      $('#view').innerHTML = `<div class="card empty err">讀不到電台資料（${esc(e.message)}）。<br>請確認網路後重新整理，或<a href="${SITE}/program/${esc(pid)}" target="_blank" rel="noopener">到電台網站收聽</a>。</div>`;
      return;
    }
    if (tok !== renderToken) return;
  } else if (!quiet){
    refreshEps(pid).then(() => { if (tok === renderToken) renderCourse(pid, true); }).catch(() => {});
  }
  const filter = state.filter[pid] || 'all';
  const order = state.order[pid] || 'asc';
  const s = stats(pid);
  const up = nextUp(pid);
  let list = eps.filter(e => filter === 'all' ? true : filter === 'todo' ? statusOf(pid, e) !== 'done' : statusOf(pid, e) === 'done');
  if (order === 'desc') list = list.slice().reverse();
  const scrollY = quiet ? window.scrollY : 0;
  let html = '';
  if (up){
    const p = prog(pid, up.id);
    html += `<button class="btn hero" id="heroGo"><div class="k">▶ ${p && p.pos && !p.done ? '繼續上次' : '下一集'}</div>
      <div class="t">${esc(up.title || epLabel(up))}${p && p.pos && !p.done ? '（從 ' + fmt(p.pos) + '）' : ''}</div></button>`;
  } else {
    html += `<div class="card panel"><p>🎉 這門課全部聽完了！</p><div class="flexgap">
      ${c.archived ? '' : '<button class="btn small" id="archiveTop">移到「已完成」</button>'}
      <button class="btn ghost small" id="addTop">＋ 新增下一門課</button></div></div>`;
  }
  html += `<div class="note">已聽 ${s.done} / ${s.total} 集</div><div class="bar" style="margin-bottom:12px"><i style="width:${s.total ? s.done / s.total * 100 : 0}%"></i></div>`;
  html += `<div class="toolbar"><div class="seg" id="filterSeg">
      <button data-f="all" class="${filter==='all'?'on':''}">全部</button>
      <button data-f="todo" class="${filter==='todo'?'on':''}">未聽</button>
      <button data-f="done" class="${filter==='done'?'on':''}">已聽</button></div>
      <button class="btn ghost small" id="orderBtn">${order === 'asc' ? '舊→新' : '新→舊'}</button></div>`;
  html += `<div class="card" id="epList">` + (list.length ? list.map(e => epRow(pid, e, up)).join('') : `<div class="empty">這裡沒有集數</div>`) + `</div>`;
  html += `<div class="section-h">課程管理</div><div class="flexgap">
    <button class="btn ghost small" id="archBtn">${c.archived ? '從「已完成」移回正在上' : '移到「已完成」'}</button>
    <a class="btn ghost small" style="text-decoration:none" href="${SITE}/program/${esc(pid)}" target="_blank" rel="noopener">電台網站</a>
    <button class="btn danger small" id="delBtn">移除課程</button></div>
    <p class="note" id="delNote" hidden>再按一次「確定移除」才會刪除。收聽紀錄會一起清掉。</p>`;
  $('#view').innerHTML = html;
  if (quiet) window.scrollTo(0, scrollY);
  const hg = $('#heroGo'); if (hg) hg.onclick = () => goEpisode(pid, up, true);
  const at = $('#archiveTop'); if (at) at.onclick = () => { c.archived = true; save(); toast('已移到「已完成」'); location.hash = '#/'; };
  const ad = $('#addTop'); if (ad) ad.onclick = () => { location.hash = '#/add'; };
  document.querySelectorAll('#filterSeg button').forEach(b => b.onclick = () => { state.filter[pid] = b.dataset.f; save(); renderCourse(pid, true); });
  $('#orderBtn').onclick = () => { state.order[pid] = order === 'asc' ? 'desc' : 'asc'; save(); renderCourse(pid, true); };
  document.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => { const ep = eps.find(e => e.id === b.dataset.ep); if (ep) goEpisode(pid, ep, true); });
  $('#archBtn').onclick = () => { c.archived = !c.archived; save(); toast(c.archived ? '已移到「已完成」' : '已移回正在上的課'); location.hash = '#/'; };
  const del = $('#delBtn');
  del.onclick = () => {
    if (del.dataset.armed){
      state.courses = state.courses.filter(x => x.id !== pid);
      Object.keys(state.progress).forEach(k => { if (k.startsWith(pid + '|')) delete state.progress[k]; });
      if (state.last && state.last.pid === pid) state.last = null;
      if (cur && cur.pid === pid){ audio.pause(); cur = null; }
      save(); lsDel('rc_eps_' + pid); delete epsMem[pid];
      toast('已移除'); location.hash = '#/';
    } else { del.dataset.armed = '1'; del.textContent = '確定移除'; $('#delNote').hidden = false; }
  };
}
function epRow(pid, e, up){
  const st = statusOf(pid, e);
  const p = prog(pid, e.id);
  const icon = st === 'done' ? '<span class="ok">✓</span>' : st === 'half' ? '<span class="half">◐</span>' : '';
  const sub = st === 'half' ? `聽到 ${fmt(p.pos)} / ${fmt(e.dur)}` : fmt(e.dur);
  const isCur = cur && cur.pid === pid && cur.eid === e.id;
  return `<button class="ep ${st === 'done' ? 'done' : ''} ${isCur ? 'current' : ''}" data-ep="${esc(e.id)}">
    <span class="no">${e.n != null ? e.n : ''}</span>
    <span class="tt"><div>${esc(e.title)}</div><div class="s">${sub}${e.pdf.length ? '' : '・無講義'}${isCur ? '・目前這集' : ''}</div></span>
    <span class="st">${icon}</span></button>`;
}

/* ---------- player ---------- */
let pdfZoom = false;
async function renderPlayer(pid, eid){
  const c = course(pid);
  if (!c){ location.hash = '#/'; return; }
  $('#title').textContent = c.name;
  const tok = renderToken;
  let eps;
  try { eps = await getEps(pid); } catch(e){ $('#view').innerHTML = `<div class="card empty err">讀不到電台資料，請確認網路後重新整理。</div>`; return; }
  if (tok !== renderToken) return;
  const ep = eps.find(e => e.id === eid);
  if (!ep){ $('#view').innerHTML = `<div class="card empty">找不到這一集。<br><a href="#/c/${esc(pid)}">回集數清單</a></div>`; return; }
  if (!cur || cur.pid !== pid || cur.eid !== eid) startEpisode(pid, ep, false); // 重新整理進來：先載入不自動播
  const i = eps.indexOf(ep);
  const prev = eps[i - 1], next = eps[i + 1];
  $('#view').innerHTML = `
  <div class="player">
    <div class="ptitle">${esc(ep.title)}${ep.n != null && !String(ep.title).includes(String(ep.n)) ? '・' + epLabel(ep) : ''}</div>
    ${ep.voice ? `
    <div class="prow">
      <button class="round" id="back10" aria-label="倒退10秒">−10</button>
      <button class="round big" id="playBtn" aria-label="播放／暫停">▶</button>
      <button class="round" id="fwd10" aria-label="快轉10秒">+10</button>
    </div>
    <div class="seekrow"><span id="tNow">0:00</span><input type="range" id="seek" min="0" max="${ep.dur || 600}" value="0" step="1" aria-label="播放進度"><span id="tDur">${fmt(ep.dur)}</span></div>
    <div class="prow2">
      <button class="btn ghost small" id="prevBtn" ${prev ? '' : 'disabled'}>‹ 上一集</button>
      <button class="btn ghost small speed" id="speedBtn">${state.speed}×</button>
      <button class="btn ghost small" id="nextBtn" ${next ? '' : 'disabled'}>下一集 ›</button>
    </div>` : `<p class="err">這一集沒有音檔。</p>`}
  </div>
  <div class="banner" id="nextBox" hidden></div>
  <p class="err note" id="audioErr" hidden>音檔讀取失敗。<a href="${SITE}/episode/${esc(ep.id)}" target="_blank" rel="noopener">改到電台網站收聽</a></p>
  <div class="flexgap" style="margin-top:10px">
    <button class="btn ghost small" id="markBtn">標記為已聽</button>
    ${ep.pdf.length ? '<button class="btn ghost small" id="zoomBtn">講義放大</button>' : ''}
    <a class="btn ghost small" style="text-decoration:none" href="${SITE}/episode/${esc(ep.id)}" target="_blank" rel="noopener">電台網站</a>
  </div>
  <div class="pdfbox ${pdfZoom ? 'zoom' : ''}" id="pdfBox">${ep.pdf.length ? '<div class="empty">講義載入中…</div>' : '<div class="card empty">本集沒有講義</div>'}</div>`;
  if (ep.voice){
    $('#playBtn').onclick = () => { if (!cur || cur.eid !== eid) startEpisode(pid, ep, true); else togglePlay(); };
    $('#back10').onclick = () => skip(-10);
    $('#fwd10').onclick = () => skip(10);
    $('#prevBtn').onclick = () => prev && goEpisode(pid, prev, true);
    $('#nextBtn').onclick = () => next && goEpisode(pid, next, true);
    $('#speedBtn').onclick = () => {
      state.speed = SPEEDS[(SPEEDS.indexOf(state.speed) + 1) % SPEEDS.length]; save();
      audio.playbackRate = state.speed; updateUI();
    };
    const seek = $('#seek');
    seek.addEventListener('input', () => { seek.dataset.drag = '1'; $('#tNow').textContent = fmt(seek.value); });
    seek.addEventListener('change', () => { delete seek.dataset.drag; if (!isNaN(audio.duration)) audio.currentTime = Number(seek.value); });
  }
  $('#markBtn').onclick = () => {
    const p = prog(pid, eid);
    setProg(pid, eid, p && p.done ? {done:false} : {done:true});
    toast(p && p.done ? '已改回未聽' : '已標記為聽過 ✓'); updateUI();
  };
  const zb = $('#zoomBtn');
  if (zb){ zb.textContent = pdfZoom ? '講義縮回' : '講義放大'; zb.onclick = () => { pdfZoom = !pdfZoom; $('#pdfBox').classList.toggle('zoom', pdfZoom); zb.textContent = pdfZoom ? '講義縮回' : '講義放大'; }; }
  updateUI();
  if (ep.pdf.length) renderPdf(ep, tok);
}
async function renderPdf(ep, tok){
  const box = $('#pdfBox');
  if (!window.pdfjsLib){ box.innerHTML = pdfFallback(ep, '講義元件載入失敗'); return; }
  try {
    const url = `${API}/file?key=${encodeURIComponent(ep.pdf[0].key)}`;
    const doc = await pdfjsLib.getDocument({url, disableRange:true, disableStream:true, isEvalSupported:false}).promise;
    if (tok !== renderToken) return;
    box.innerHTML = '';
    const width = Math.min(box.clientWidth || 360, 720);
    const dpr = Math.min(window.devicePixelRatio || 1, 2) * 1.7; // 預留放大清晰度
    for (let n = 1; n <= doc.numPages; n++){
      const page = await doc.getPage(n);
      if (tok !== renderToken) return;
      const base = page.getViewport({scale:1});
      const vp = page.getViewport({scale: width / base.width * dpr});
      const cv = document.createElement('canvas');
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      box.appendChild(cv);
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    }
    if (ep.pdf.length > 1){
      const more = document.createElement('p'); more.className = 'note';
      more.innerHTML = '本集另有講義：' + ep.pdf.slice(1).map(a => `<a href="${API}/file?key=${encodeURIComponent(a.key)}" target="_blank" rel="noopener">${esc(a.name)}</a>`).join('、');
      box.appendChild(more);
    }
  } catch(e){
    if (tok === renderToken) box.innerHTML = pdfFallback(ep, '講義載入失敗');
  }
}
function pdfFallback(ep, msg){
  return `<div class="card empty">${msg}。<br><a href="${API}/file?key=${encodeURIComponent(ep.pdf[0].key)}" target="_blank" rel="noopener">直接開啟講義 PDF</a>・<a href="${SITE}/episode/${esc(ep.id)}" target="_blank" rel="noopener">電台網站</a></div>`;
}

/* ---------- add course ---------- */
function renderAdd(){
  $('#title').textContent = '新增課程';
  $('#view').innerHTML = `<div class="card panel">
    <p>到教育電台 Channel+ 找到想聽的節目，複製該節目頁的網址貼在下面。</p>
    <p class="note">網址長得像：channelplus.ner.gov.tw/program/xxxxxxxx-xxxx-…</p>
    <input type="text" id="addUrl" placeholder="貼上節目網址" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="flexgap" style="margin-top:10px">
      <button class="btn" id="addCheck">查詢</button>
      <a class="btn ghost" style="text-decoration:none" href="${SITE}" target="_blank" rel="noopener">開啟 Channel+</a>
    </div>
    <div id="addResult" style="margin-top:14px"></div></div>`;
  $('#addCheck').onclick = checkAdd;
  $('#addUrl').addEventListener('keydown', e => { if (e.key === 'Enter') checkAdd(); });
}
async function checkAdd(){
  const out = $('#addResult');
  const m = ($('#addUrl').value || '').match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  if (!m){ out.innerHTML = `<p class="err">找不到節目代碼，請確認貼上的是 Channel+ 的「節目」頁網址（網址中有 /program/）。</p>`; return; }
  const pid = m[0].toLowerCase();
  const exist = course(pid);
  if (exist){ out.innerHTML = `<p>「${esc(exist.name)}」已經在你的課程裡了。<a href="#/c/${esc(pid)}">前往</a></p>`; return; }
  out.innerHTML = `<p class="note">查詢中…</p>`;
  try {
    const d = await fetchJSON(`${API}/programs/${pid}`);
    const pg = d.data && d.data.program;
    if (!pg) throw new Error('查無節目');
    const first = await fetchJSON(`${API}/programs/episodes/${pid}?page=1`);
    const total = first.pagination ? first.pagination.totalCount : (first.data || []).length;
    const sample = (first.data || [])[0];
    const hasPdf = sample && (sample.attachments || []).some(a => (a.fileType || '').toLowerCase() === 'pdf');
    const img = pg.image && pg.image.imageRef;
    out.innerHTML = `<div class="course" style="padding:0"><img src="${esc(imgUrl(img))}" alt="">
      <div class="info"><div class="name">${esc(pg.name)}</div><div class="meta">共 ${total} 集${sample ? (hasPdf ? '・有講義' : '・最新一集無講義') : ''}</div></div></div>
      <button class="btn" id="addConfirm" style="width:100%;margin-top:12px" ${total ? '' : 'disabled'}>加入我的課程</button>
      ${total ? '' : '<p class="err">這個節目目前沒有任何集數。</p>'}`;
    const b = $('#addConfirm');
    if (b) b.onclick = () => {
      state.courses.push({id:pid, name:pg.name, image:img || null, addedAt:Date.now(), archived:false});
      save(); toast('已加入「' + pg.name + '」');
      location.hash = '#/c/' + pid;
    };
  } catch(e){
    out.innerHTML = `<p class="err">查不到這個節目（${esc(e.message)}）。請確認網址，或稍後再試。</p>`;
  }
}

/* ---------- settings ---------- */
function renderSettings(){
  $('#title').textContent = '設定與備份';
  const n = Object.values(state.progress).filter(p => p.done).length;
  $('#view').innerHTML = `
  <div class="card panel"><p><b>收聽紀錄備份</b></p>
    <p class="note">紀錄只存在這支手機上（共 ${state.courses.length} 門課、${n} 集已聽）。換手機或清除 Safari 資料前，先匯出一份。</p>
    <div class="flexgap"><button class="btn" id="expBtn">匯出紀錄</button>
    <label class="btn ghost" style="display:inline-block">匯入紀錄<input type="file" id="impFile" accept="application/json,.json" hidden></label></div>
    <p class="note" id="impMsg"></p></div>
  <div class="card panel"><p><b>使用提醒</b></p>
    <p class="note">・請從手機主畫面的「電台課程」圖示開啟，紀錄才會存在同一處（Safari 分頁的紀錄與主畫面 App 分開）。</p>
    <p class="note">・音檔與講義都是即時從教育廣播電台 Channel+ 讀取，本頁不保存任何節目內容。電台新增集數會自動出現。</p>
    <p class="note">・播到 90% 會自動記為「已聽」，也可在播放頁手動改。</p></div>
  <div class="card panel"><p><b>外觀</b></p><div class="seg" id="themeSeg">
    <button data-t="auto">跟隨系統</button><button data-t="light">淺色</button><button data-t="dark">深色</button></div></div>`;
  $('#expBtn').onclick = () => {
    const data = JSON.stringify({app:'radio-courses', version:1, exportedAt:new Date().toISOString(),
      courses:state.courses, progress:state.progress, last:state.last || null, speed:state.speed}, null, 1);
    const blob = new Blob([data], {type:'application/json'});
    const a = document.createElement('a');
    const d = new Date();
    a.download = `電台課程紀錄-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    a.href = URL.createObjectURL(blob);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('#impFile').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== 'radio-courses' || !Array.isArray(d.courses)) throw new Error('格式不符');
      // 合併：課程取聯集；同一集取較新的紀錄
      d.courses.forEach(c => { if (c && c.id && !course(c.id)) state.courses.push(c); });
      Object.entries(d.progress || {}).forEach(([k, v]) => { const o = state.progress[k]; if (!o || (v && v.t > (o.t || 0))) state.progress[k] = v; });
      if (d.last && !state.last) state.last = d.last;
      save();
      $('#impMsg').textContent = '匯入完成 ✓';
    } catch(e){ $('#impMsg').textContent = '匯入失敗：' + e.message; }
    ev.target.value = '';
  };
  const themeCur = state.theme || 'auto';
  document.querySelectorAll('#themeSeg button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === themeCur);
    b.onclick = () => { state.theme = b.dataset.t; save(); applyTheme(); renderSettings(); };
  });
}
function applyTheme(){
  const t = state.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

applyTheme();
render();
</script>
